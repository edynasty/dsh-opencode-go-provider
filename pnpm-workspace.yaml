# Optional transitive build scripts of @earendil-works/pi-ai (Google Vertex
# paths only; never needed by the openai/anthropic transports this bundle uses).
allowBuilds:
  '@google/genai': false
  protobufjs: false
# DSH rc.7 Host satisfies the provider's peerDependencies at install time.
# Do not auto-install peers into this repository's own node_modules during
# development; only devDependencies used by the local gates are installed here.
autoInstallPeers: false
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/dsh-credentials@0.1.0-rc.7'
  - '@deepseek-ai/dsh-launch-environment@0.1.0-rc.7'
  - '@deepseek-ai/dsh-llm@0.1.0-rc.7'
  - '@deepseek-ai/dsh-settings@0.1.0-rc.7'
  - '@deepseek-ai/dsh-timeout@0.1.0-rc.7'
  - '@deepseek-ai/schemastery@3.18.1'
  - '@deepseek-ai/dsh-attachment@0.1.0-rc.7'
  - '@deepseek-ai/dsh-brand@0.1.0-rc.7'
  - '@deepseek-ai/dsh-invariants@0.1.0-rc.7'
